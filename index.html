<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe6;--card:#fbf9f4;--ink:#1c1a15;--ink2:#5e584c;--ink3:#948d7f;--rule:#e0d9cb;
  --accent:#c4492f;--accent-ink:#fff;--up:#2f7a4f;--down:#b8402a;--warn:#a8701b;--chip:#ebe5d8;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Inter Tight",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14130f;--card:#1c1b16;--ink:#efe9dc;--ink2:#b3ab9b;--ink3:#7d766a;--rule:#2e2b24;
  --accent:#e2694c;--up:#5cbf86;--down:#ef7a60;--warn:#e0a547;--chip:#26241e}}
:root[data-theme="dark"]{--paper:#14130f;--card:#1c1b16;--ink:#efe9dc;--ink2:#b3ab9b;--ink3:#7d766a;--rule:#2e2b24;
  --accent:#e2694c;--up:#5cbf86;--down:#ef7a60;--warn:#e0a547;--chip:#26241e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
.brand{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent)}
.pill{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.pill.live{background:var(--accent);color:var(--accent-ink)}
.pill.warn{background:var(--warn);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:500 13px var(--sans);padding:7px 12px;border-radius:999px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.label{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:3px}
.hero{padding:14px 0 6px}
.big{font:600 44px/1.05 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 12px}
.stat .v{font:600 22px var(--sans);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:12px;color:var(--ink3)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.list>.item{padding:12px 0;border-top:1px solid var(--rule)}
.list>.item:first-child{border-top:0}
.tk{font:600 16px var(--sans)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13.5px}
.sparkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spark{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 9px}
.spark.sel{outline:2px solid var(--accent);outline-offset:-1px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.rating{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--chip)}
.rating.buy,.rating.overweight{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.rating.sell,.rating.underweight{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:600 15px var(--sans);background:var(--ink);color:var(--paper);margin:8px 0}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.btn.danger{background:var(--down);color:#fff}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;font:15px var(--sans);padding:12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);margin:6px 0 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--ink3);font:500 10px var(--mono);letter-spacing:.02em;text-transform:uppercase;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:10;overflow-y:auto;padding:env(safe-area-inset-top) 0 40px;display:none}
.sheet.open{display:block}
.md h1,.md h2,.md h3{font-size:16px;margin:18px 0 6px}
.md p,.md li{color:var(--ink2);font-size:14.5px}
.md table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--rule);padding:4px 6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;display:none}
.empty{color:var(--ink3);text-align:center;padding:28px 8px;font-size:14px}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px}
a{color:var(--accent)}
.hide{display:none}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);font:inherit}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block;font-size:15.5px;margin-bottom:2px}
.opt span{color:var(--ink2);font-size:13.5px}
.warnbox{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));font-size:14px}
.status.liquidating,.status.halted,.status.error{border-color:var(--down)}
.status.paused,.status.cautious{border-color:var(--warn)}
.warn{color:var(--warn)}
.steps{display:flex;gap:6px;margin-top:10px}
.steps span{flex:1;text-align:center;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;border-radius:6px;background:var(--chip);color:var(--ink3)}
.steps span.on{background:var(--ink);color:var(--paper)}
.steps span.now{background:var(--accent);color:var(--accent-ink)}
.rowbtn,.spark{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.spark{background:var(--card);border:1px solid var(--rule)}
.list>.rowbtn{border-top:1px solid var(--rule)}.list>.rowbtn:first-child{border-top:0}
.planrow{font-size:13.5px;padding:5px 0;border-top:1px solid var(--rule)}
button.chip{cursor:pointer}
.refresh{margin-top:10px;align-items:center;gap:8px}
.refresh .chip{white-space:nowrap}
.chip:disabled{opacity:.6}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">AI<b>/</b>Desk</div>
    <div id="mode" class="pill">—</div>
  </header>
  <main id="view"></main>
</div>

<nav id="nav">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Today</button>
  <button data-tab="positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Holdings</button>
  <button data-tab="decisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5"/><circle cx="16" cy="15" r="5"/></svg>Agents</button>
  <button data-tab="odds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Odds</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Goals</button>
  <button data-tab="control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg>Control</button>
</nav>

<div id="sheet" class="sheet"><div class="wrap" id="sheetBody"></div></div>
<div id="toast" class="toast"></div>

<script src="vendor/marked-12.0.2.min.js"></script>
<script src="vendor/purify-3.3.3.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
